<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Панорама 360°</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
body{font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif;color:#fff;height:100dvh}

:root{
  --cyan:#00e5ff;
  --red:#ff3b30;
  --green:#30d158;
  --safe-top:env(safe-area-inset-top,0px);
  --safe-bottom:env(safe-area-inset-bottom,0px);
}

/* SCREENS */
.screen{position:absolute;inset:0;display:none}
.screen.active{display:block}

/* ═══════ HOME ═══════ */
#home{
  background:#000;
  display:none;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:0;
}
#home.active{display:flex}

.home-logo{
  width:90px;height:90px;margin-bottom:24px;
}
.home-logo svg{width:100%;height:100%}
.spin1{animation:spin 8s linear infinite;transform-origin:45px 45px}
.spin2{animation:spin 5s linear infinite reverse;transform-origin:45px 45px}
@keyframes spin{to{transform:rotate(360deg)}}

.home-title{
  font-size:38px;font-weight:200;letter-spacing:10px;
  text-transform:uppercase;text-align:center;margin-bottom:6px;
}
.home-sub{
  font-size:12px;letter-spacing:5px;color:rgba(255,255,255,0.35);
  text-transform:uppercase;margin-bottom:48px;text-align:center;
}

.home-btn{
  width:200px;height:52px;border-radius:26px;border:none;cursor:pointer;
  background:linear-gradient(135deg,var(--cyan),#006e9e);
  color:#000;font-size:15px;font-weight:600;letter-spacing:1px;
  display:flex;align-items:center;justify-content:center;gap:10px;
  margin-bottom:14px;
  box-shadow:0 0 40px rgba(0,229,255,0.25);
  transition:transform .1s;
}
.home-btn:active{transform:scale(0.96)}

.home-btn2{
  width:200px;height:44px;border-radius:22px;cursor:pointer;
  background:transparent;border:1px solid rgba(255,255,255,0.18);
  color:rgba(255,255,255,0.55);font-size:13px;
  display:flex;align-items:center;justify-content:center;gap:8px;
}
.home-btn2:active{background:rgba(255,255,255,0.08)}

/* ═══════ CAMERA ═══════ */
#cam{background:#000;position:relative;overflow:hidden}

#vid{
  position:absolute;
  top:0;left:0;
  width:100%;height:100%;
  object-fit:cover;
  display:block;
}

/* top controls overlay */
.top-bar{
  position:absolute;
  top:0;left:0;right:0;
  padding-top:var(--safe-top);
  z-index:50;
  pointer-events:none;
}
.top-bar-inner{
  display:flex;align-items:center;justify-content:space-between;
  padding:10px 16px 0;
  pointer-events:all;
}

.icon-btn{
  width:40px;height:40px;border-radius:50%;
  background:rgba(0,0,0,0.55);
  border:1px solid rgba(255,255,255,0.18);
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  color:#fff;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;
}

.top-center{
  display:flex;flex-direction:column;align-items:center;gap:2px;
}
.top-angle{
  font-size:24px;font-weight:100;letter-spacing:2px;
  color:#fff;line-height:1;
  font-variant-numeric:tabular-nums;
}
.top-status{
  font-size:10px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,0.45);
}
.top-status.rec{
  color:var(--red);
  animation:blink .9s step-end infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0.2}}

/* progress bar under top bar */
.prog-bar-wrap{
  position:absolute;
  top:calc(var(--safe-top) + 58px);
  left:0;right:0;height:2px;
  background:rgba(255,255,255,0.1);
  z-index:50;
}
.prog-bar{
  height:100%;width:0%;
  background:linear-gradient(90deg,var(--cyan),#7b61ff);
  transition:width .1s linear;
}
.prog-bar.rec{background:var(--red)}

/* crosshair */
.crosshair{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%,-50%);
  z-index:30;pointer-events:none;
  width:60px;height:60px;
}
.ch-h,.ch-v{position:absolute;background:rgba(255,255,255,0.65)}
.ch-h{width:100%;height:1px;top:50%;transform:translateY(-50%)}
.ch-v{height:100%;width:1px;left:50%;transform:translateX(-50%)}
.ch-dot{
  position:absolute;top:50%;left:50%;
  width:6px;height:6px;border-radius:50%;
  background:var(--cyan);
  transform:translate(-50%,-50%);
  box-shadow:0 0 10px var(--cyan);
  transition:background .2s;
}
.ch-dot.rec{background:var(--red);box-shadow:0 0 10px var(--red)}

/* level */
.level-bar{
  position:absolute;
  top:50%;left:50%;
  transform:translate(-50%, 42px);
  z-index:30;pointer-events:none;
  width:110px;height:2px;
  background:rgba(255,255,255,0.12);
  border-radius:2px;
}
.level-dot{
  position:absolute;
  top:50%;left:50%;
  width:8px;height:8px;border-radius:50%;
  background:var(--green);
  transform:translate(-50%,-50%);
  box-shadow:0 0 7px var(--green);
  transition:left .1s, background .2s;
}
.level-dot.warn{background:#ffd60a;box-shadow:0 0 7px #ffd60a}
.level-dot.bad{background:var(--red);box-shadow:0 0 7px var(--red)}

/* live strip at bottom (above controls) */
.live-strip{
  position:absolute;
  bottom:calc(var(--safe-bottom) + 138px);
  left:14px;right:14px;
  z-index:40;
  display:none;
  flex-direction:column;
  gap:4px;
  pointer-events:none;
}
.live-strip.visible{display:flex}
.strip-canvas-wrap{
  height:44px;border-radius:8px;overflow:hidden;
  border:1px solid rgba(255,255,255,0.12);
  background:rgba(0,0,0,0.5);
  position:relative;
}
#stripCanvas{display:block;width:100%;height:44px}
.strip-cursor{
  position:absolute;top:0;bottom:0;left:0;
  width:2px;background:var(--red);
  box-shadow:0 0 6px var(--red);
  transition:left .08s linear;
}
.strip-fade{
  position:absolute;inset:0;
  background:linear-gradient(to right,rgba(0,0,0,.5) 0%,transparent 12%,transparent 88%,rgba(0,0,0,.5) 100%);
  pointer-events:none;
}
.strip-pct{
  text-align:center;
  font-size:10px;letter-spacing:2px;
  color:rgba(255,255,255,0.35);
}

/* toast inside camera */
.cam-toast{
  position:absolute;
  bottom:calc(var(--safe-bottom) + 194px);
  left:14px;right:14px;
  z-index:50;
  background:rgba(0,0,0,0.72);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:12px;padding:10px 14px;
  font-size:13px;color:rgba(255,255,255,0.85);
  text-align:center;line-height:1.5;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  transition:opacity .35s,transform .35s;
  pointer-events:none;
}
.cam-toast.hidden{opacity:0;transform:translateY(6px)}

/* BOTTOM CONTROLS — fixed height, safe area */
.bottom-bar{
  position:absolute;
  bottom:0;left:0;right:0;
  padding-bottom:calc(var(--safe-bottom) + 20px);
  padding-top:12px;
  padding-left:28px;
  padding-right:28px;
  background:linear-gradient(to top,rgba(0,0,0,0.82) 0%,transparent 100%);
  z-index:50;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.side-btn{
  width:52px;height:52px;border-radius:14px;
  background:rgba(255,255,255,0.09);
  border:1px solid rgba(255,255,255,0.15);
  color:#fff;font-size:21px;
  display:flex;align-items:center;justify-content:center;
  cursor:pointer;flex-shrink:0;overflow:hidden;
  position:relative;
}
.side-btn img{width:100%;height:100%;object-fit:cover;display:none}
.side-btn .side-icon{font-size:22px;color:rgba(255,255,255,0.5)}
.side-btn .cnt-badge{
  display:none;position:absolute;
  top:3px;right:3px;
  width:16px;height:16px;border-radius:50%;
  background:var(--cyan);color:#000;
  font-size:9px;font-weight:800;
  align-items:center;justify-content:center;
}

/* THE RECORD BUTTON */
.rec-wrap{
  display:flex;flex-direction:column;
  align-items:center;gap:5px;flex-shrink:0;
}
.rec-btn{
  width:76px;height:76px;border-radius:50%;
  background:rgba(255,255,255,0.1);
  border:3px solid rgba(255,255,255,0.65);
  cursor:pointer;
  display:flex;align-items:center;justify-content:center;
  transition:transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.rec-btn:active{transform:scale(0.92)}
.rec-inner{
  width:56px;height:56px;border-radius:50%;
  background:var(--red);
  transition:all .2s cubic-bezier(.4,0,.2,1);
  box-shadow:0 0 18px rgba(255,59,48,0.55);
}
.rec-btn.recording .rec-inner{
  width:26px;height:26px;
  border-radius:6px;
}
.rec-label{
  font-size:10px;letter-spacing:2px;text-transform:uppercase;
  color:rgba(255,255,255,0.45);
}
.rec-label.recording{
  color:var(--red);
  animation:blink .9s step-end infinite;
}

/* flash */
.flash{
  position:absolute;inset:0;background:#fff;
  opacity:0;z-index:100;pointer-events:none;
  transition:opacity .05s;
}
.flash.go{opacity:0.5}

/* scan lines */
.scanlines{
  position:absolute;inset:0;z-index:10;pointer-events:none;
  background:repeating-linear-gradient(to bottom,transparent,transparent 2px,rgba(0,0,0,.035) 2px,rgba(0,0,0,.035) 4px);
  opacity:0.8;
}

/* ═══════ PREVIEW ═══════ */
#preview{
  background:#050508;
  display:none;flex-direction:column;
}
#preview.active{display:flex}

.prev-head{
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-top) + 14px) 14px 12px;
  background:rgba(0,0,0,0.5);
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
}
.prev-back{
  width:36px;height:36px;border-radius:9px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
  flex-shrink:0;
}
.prev-info{flex:1}
.prev-info h2{font-size:16px;font-weight:600}
.prev-info p{font-size:11px;color:rgba(255,255,255,0.35);margin-top:2px}
.prev-btns{display:flex;gap:8px;flex-shrink:0}
.pbtn{
  height:34px;padding:0 12px;border-radius:8px;
  border:1px solid rgba(255,255,255,0.14);
  background:rgba(255,255,255,0.06);
  color:rgba(255,255,255,0.7);
  font-size:12px;font-weight:600;cursor:pointer;
  display:flex;align-items:center;gap:5px;transition:opacity .15s;
}
.pbtn:active{opacity:0.7}
.pbtn.hi{background:var(--cyan);border-color:transparent;color:#000}

.viewer-wrap{
  flex:1;background:#000;
  position:relative;overflow:hidden;
  touch-action:none;
}
#viewCanvas{
  position:absolute;top:0;left:0;cursor:grab;display:block;
}
#viewCanvas:active{cursor:grabbing}
.view-hint{
  position:absolute;bottom:12px;
  left:50%;transform:translateX(-50%);
  background:rgba(0,0,0,0.6);
  border:1px solid rgba(255,255,255,0.1);
  border-radius:20px;padding:5px 14px;
  font-size:11px;letter-spacing:1px;
  color:rgba(255,255,255,0.45);
  pointer-events:none;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  white-space:nowrap;
}

/* ═══════ GALLERY ═══════ */
#gallery{
  background:#050508;
  display:none;flex-direction:column;
}
#gallery.active{display:flex}

.gal-head{
  display:flex;align-items:center;gap:10px;
  padding:calc(var(--safe-top) + 14px) 14px 12px;
  background:rgba(0,0,0,0.5);
  border-bottom:1px solid rgba(255,255,255,0.07);
  flex-shrink:0;
}
.gal-back{
  width:36px;height:36px;border-radius:9px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,255,255,0.12);
  color:#fff;font-size:18px;
  display:flex;align-items:center;justify-content:center;cursor:pointer;
}
.gal-ttl{flex:1;font-size:17px;font-weight:600}
.gal-cnt{font-size:11px;color:rgba(255,255,255,0.3);letter-spacing:1px}
.gal-grid{
  flex:1;overflow-y:auto;padding:14px;
  display:grid;grid-template-columns:1fr 1fr;gap:10px;
  -webkit-overflow-scrolling:touch;
}
.gal-card{
  aspect-ratio:2.2/1;border-radius:10px;overflow:hidden;
  position:relative;cursor:pointer;
  background:#111;border:1px solid rgba(255,255,255,0.07);
  transition:transform .15s;
}
.gal-card:active{transform:scale(0.97)}
.gal-card img{width:100%;height:100%;object-fit:cover;display:block}
.gal-card-info{
  position:absolute;bottom:0;left:0;right:0;
  background:linear-gradient(to top,rgba(0,0,0,0.85),transparent);
  padding:14px 8px 6px;
  font-size:10px;color:rgba(255,255,255,0.65);
}
.gal-empty{
  grid-column:1/-1;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:10px;
  padding:70px 20px;text-align:center;
}
.gal-empty-icon{font-size:54px;opacity:0.3}
.gal-empty-ttl{font-size:16px;font-weight:600;color:rgba(255,255,255,0.4)}
.gal-empty-sub{font-size:12px;color:rgba(255,255,255,0.2)}

/* ═══════ LOADING ═══════ */
.loading{
  position:fixed;inset:0;z-index:999;
  background:rgba(0,0,0,0.85);
  display:none;flex-direction:column;
  align-items:center;justify-content:center;gap:14px;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.loading.on{display:flex}
.spinner{
  width:44px;height:44px;border-radius:50%;
  border:2px solid rgba(0,229,255,0.15);
  border-top-color:var(--cyan);
  animation:spin .7s linear infinite;
}
.spin-txt{
  font-size:11px;letter-spacing:3px;text-transform:uppercase;
  color:rgba(255,255,255,0.4);
}

/* ═══════ GLOBAL TOAST ═══════ */
.g-toast{
  position:fixed;
  bottom:calc(var(--safe-bottom)+20px);
  left:50%;transform:translateX(-50%) translateY(64px);
  z-index:998;
  background:rgba(25,25,35,0.95);
  border:1px solid rgba(255,255,255,0.12);
  border-radius:12px;padding:10px 18px;
  font-size:13px;color:#fff;
  white-space:normal;text-align:center;
  max-width:calc(100vw - 32px);
  transition:transform .4s cubic-bezier(.34,1.56,.64,1);
  pointer-events:none;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
}
.g-toast.show{transform:translateX(-50%) translateY(0)}
.g-toast.ok{border-color:rgba(48,209,88,.4);color:var(--green)}
.g-toast.err{border-color:rgba(255,59,48,.4);color:var(--red)}
</style>
</head>
<body>

<!-- HOME -->
<div class="screen active" id="home">
  <div class="home-logo">
    <svg viewBox="0 0 90 90" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle class="spin1" cx="45" cy="45" r="41" stroke="rgba(0,229,255,.2)" stroke-width="1" stroke-dasharray="6 5"/>
      <circle cx="45" cy="45" r="30" stroke="rgba(0,229,255,.08)" stroke-width="1"/>
      <circle class="spin2" cx="45" cy="45" r="19" stroke="rgba(0,229,255,.3)" stroke-width="1.5" stroke-dasharray="10 4"/>
      <line x1="45" y1="2" x2="45" y2="88" stroke="rgba(0,229,255,.12)" stroke-width="1"/>
      <line x1="2" y1="45" x2="88" y2="45" stroke="rgba(0,229,255,.12)" stroke-width="1"/>
      <circle cx="45" cy="45" r="5" fill="#00e5ff"/>
      <circle cx="45" cy="45" r="11" fill="rgba(0,229,255,.07)" stroke="rgba(0,229,255,.35)" stroke-width="1"/>
      <line x1="45" y1="2" x2="45" y2="9" stroke="rgba(0,229,255,.6)" stroke-width="2" stroke-linecap="round"/>
      <line x1="45" y1="81" x2="45" y2="88" stroke="rgba(0,229,255,.6)" stroke-width="2" stroke-linecap="round"/>
      <line x1="2" y1="45" x2="9" y2="45" stroke="rgba(0,229,255,.6)" stroke-width="2" stroke-linecap="round"/>
      <line x1="81" y1="45" x2="88" y2="45" stroke="rgba(0,229,255,.6)" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </div>
  <div class="home-title">Панорама</div>
  <div class="home-sub">360° Camera</div>
  <button class="home-btn" onclick="startCam()">
    <span>⏺</span> Начать съёмку
  </button>
  <button class="home-btn2" onclick="goGallery()">
    📁 Галерея
  </button>
</div>

<!-- CAMERA -->
<div class="screen" id="cam">
  <video id="vid" autoplay playsinline muted></video>
  <div class="scanlines"></div>
  <div class="flash" id="flash"></div>

  <!-- top bar -->
  <div class="top-bar">
    <div class="top-bar-inner">
      <div class="icon-btn" onclick="exitCam()">‹</div>
      <div class="top-center">
        <div class="top-angle" id="topAngle">0°</div>
        <div class="top-status" id="topStatus">НАЖМИТЕ ЗАПИСЬ</div>
      </div>
      <div class="icon-btn" id="flipBtn" onclick="flipCam()">⟳</div>
    </div>
  </div>

  <!-- progress bar -->
  <div class="prog-bar-wrap">
    <div class="prog-bar" id="progBar"></div>
  </div>

  <!-- crosshair -->
  <div class="crosshair">
    <div class="ch-h"></div>
    <div class="ch-v"></div>
    <div class="ch-dot" id="chDot"></div>
  </div>

  <!-- level -->
  <div class="level-bar">
    <div class="level-dot" id="levelDot"></div>
  </div>

  <!-- live strip -->
  <div class="live-strip" id="liveStrip">
    <div class="strip-canvas-wrap">
      <canvas id="stripCanvas" height="44"></canvas>
      <div class="strip-fade"></div>
      <div class="strip-cursor" id="stripCursor"></div>
    </div>
    <div class="strip-pct" id="stripPct">0% покрыто</div>
  </div>

  <!-- camera toast -->
  <div class="cam-toast" id="camToast">
    📱 Нажмите ● для начала записи, затем медленно поворачивайте вправо
  </div>

  <!-- bottom bar -->
  <div class="bottom-bar">
    <!-- gallery thumb -->
    <div class="side-btn" id="galBtn" onclick="goGallery()">
      <img id="galThumbImg" alt="">
      <span class="side-icon">📁</span>
      <span class="cnt-badge" id="cntBadge"></span>
    </div>

    <!-- RECORD BUTTON -->
    <div class="rec-wrap">
      <div class="rec-btn" id="recBtn" onclick="toggleRec()">
        <div class="rec-inner" id="recInner"></div>
      </div>
      <div class="rec-label" id="recLabel">ЗАПИСЬ</div>
    </div>

    <!-- flip -->
    <div class="side-btn" onclick="flipCam()">⟳</div>
  </div>
</div>

<!-- PREVIEW -->
<div class="screen" id="preview">
  <div class="prev-head">
    <div class="prev-back" onclick="closePreview()">‹</div>
    <div class="prev-info">
      <h2>Панорама 360°</h2>
      <p id="prevSub">—</p>
    </div>
    <div class="prev-btns">
      <button class="pbtn" onclick="savePano()">💾</button>
      <button class="pbtn hi" onclick="sharePano()">↗ Поделиться</button>
    </div>
  </div>
  <div class="viewer-wrap" id="viewerWrap">
    <canvas id="viewCanvas"></canvas>
    <div class="view-hint" id="viewHint">← тяните для обзора →</div>
  </div>
</div>

<!-- GALLERY -->
<div class="screen" id="gallery">
  <div class="gal-head">
    <div class="gal-back" onclick="closeGallery()">‹</div>
    <div class="gal-ttl">Галерея</div>
    <div class="gal-cnt" id="galCnt"></div>
  </div>
  <div class="gal-grid" id="galGrid"></div>
</div>

<!-- LOADING -->
<div class="loading" id="loading">
  <div class="spinner"></div>
  <div class="spin-txt" id="spinTxt">Обработка</div>
</div>

<!-- GLOBAL TOAST -->
<div class="g-toast" id="gToast"></div>

<script>
/* ─── CONSTANTS ─── */
const PANO_W = 4096;
const PANO_H = 640;

/* ─── STATE ─── */
let vs = null;           // video stream
let facing = 'environment';
let recording = false;
let gyroOk = false;
let touchMode = false;

// Angle tracking
let prevAlpha = null;
let contAngle = 0;       // continuously accumulates
let startAngle = 0;      // angle when rec started
let delta = 0;           // degrees since rec start
let lastDrawn = -1;      // last drawn angle

// Offscreen panorama
let panoC = null;
let panoCtx = null;
let rafRec = null;

// Gallery
let panos = [];
let curIdx = -1;

// Touch
let touchX = null;
let mX = null;

/* ─── UTIL ─── */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function showLoad(t){
  document.getElementById('spinTxt').textContent=(t||'Обработка').toUpperCase();
  document.getElementById('loading').classList.add('on');
}
function hideLoad(){document.getElementById('loading').classList.remove('on')}

let gtTimer;
function gToast(msg,type=''){
  const el=document.getElementById('gToast');
  el.textContent=msg;el.className='g-toast show '+type;
  clearTimeout(gtTimer);gtTimer=setTimeout(()=>el.classList.remove('show'),3200);
}

let ctTimer;
function cToast(msg){
  const el=document.getElementById('camToast');
  el.textContent=msg;el.classList.remove('hidden');
  clearTimeout(ctTimer);ctTimer=setTimeout(()=>el.classList.add('hidden'),6000);
}

/* ─── CAMERA ─── */
async function startCam(){
  showLoad('Запуск камеры');
  try{
    vs=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:facing,width:{ideal:1920},height:{ideal:1080}},audio:false
    });
    const v=document.getElementById('vid');
    v.srcObject=vs;
    await v.play();
    hideLoad();
    show('cam');
    initGyro();
    setAngleUI(0);
    cToast('📱 Нажмите ● для начала записи, затем медленно поворачивайтесь вправо');
  }catch(e){
    hideLoad();
    gToast('❌ Нет доступа к камере. Разрешите в настройках.','err');
  }
}

function exitCam(){
  stopRec(true);
  stopVid();
  window.removeEventListener('deviceorientation',onGyro,true);
  show('home');
}

function stopVid(){
  if(vs){vs.getTracks().forEach(t=>t.stop());vs=null;}
}

async function flipCam(){
  const btn=document.getElementById('flipBtn');
  btn.style.transform='rotateY(360deg)';
  btn.style.transition='transform .5s';
  setTimeout(()=>{btn.style.transform='';btn.style.transition='';},500);
  facing=facing==='environment'?'user':'environment';
  if(vs){
    vs.getTracks().forEach(t=>t.stop());
    try{
      vs=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing},audio:false});
      document.getElementById('vid').srcObject=vs;
    }catch(e){facing=facing==='environment'?'user':'environment';}
  }
}

/* ─── GYRO ─── */
function initGyro(){
  prevAlpha=null;contAngle=0;gyroOk=false;touchMode=false;
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission()
      .then(s=>{
        if(s==='granted')window.addEventListener('deviceorientation',onGyro,true);
        else enableTouch();
      }).catch(()=>enableTouch());
  }else{
    window.addEventListener('deviceorientation',onGyro,true);
    setTimeout(()=>{if(!gyroOk)enableTouch();},1500);
  }
}

function onGyro(e){
  if(e.alpha===null||e.alpha===undefined){if(!gyroOk)enableTouch();return;}
  gyroOk=true;
  if(prevAlpha===null){prevAlpha=e.alpha;return;}
  let d=e.alpha-prevAlpha;
  if(d>180)d-=360;if(d<-180)d+=360;
  contAngle+=d;prevAlpha=e.alpha;
  updateLevel(e.gamma);
  tick();
}

function enableTouch(){
  touchMode=true;
  document.getElementById('topStatus').textContent='ТЯНИТЕ ЭКРАН ВЛЕВО';
  cToast('👆 Гироскоп недоступен — тяните экран влево для поворота');
}

/* ─── TICK (angle update) ─── */
function tick(){
  delta=contAngle-startAngle;
  const disp=Math.abs(delta)%360;
  setAngleUI(disp);
  if(recording&&Math.abs(delta)>=360){stopRec(false);}
}

function setAngleUI(deg){
  document.getElementById('topAngle').textContent=Math.round(Math.abs(delta||0))+'°';
  const pct=Math.min(deg/360,1);
  const pb=document.getElementById('progBar');
  pb.style.width=(pct*100).toFixed(1)+'%';
  // strip cursor
  document.getElementById('stripCursor').style.left=(pct*100).toFixed(1)+'%';
  document.getElementById('stripPct').textContent=Math.round(pct*100)+'% покрыто';
}

function updateLevel(g){
  if(g===null||g===undefined)return;
  const t=Math.max(-45,Math.min(45,g));
  const p=50+(t/45)*40;
  const d=document.getElementById('levelDot');
  d.style.left=p+'%';
  const a=Math.abs(t);
  d.className='level-dot'+(a>25?' bad':a>12?' warn':'');
}

/* ─── RECORD ─── */
function toggleRec(){
  recording?stopRec(false):startRec();
}

function startRec(){
  recording=true;
  startAngle=contAngle;delta=0;lastDrawn=-1;

  panoC=document.createElement('canvas');
  panoC.width=PANO_W;panoC.height=PANO_H;
  panoCtx=panoC.getContext('2d');
  panoCtx.fillStyle='#0a0a0e';
  panoCtx.fillRect(0,0,PANO_W,PANO_H);

  // setup strip canvas
  const sw=document.getElementById('liveStrip');
  sw.classList.add('visible');
  const sc=document.getElementById('stripCanvas');
  const wrap=sw.querySelector('.strip-canvas-wrap');
  sc.width=wrap.clientWidth||320;sc.height=44;

  document.getElementById('recBtn').classList.add('recording');
  document.getElementById('recLabel').textContent='■ СТОП';
  document.getElementById('recLabel').classList.add('recording');
  document.getElementById('topStatus').textContent='● ЗАПИСЬ';
  document.getElementById('topStatus').classList.add('rec');
  document.getElementById('progBar').classList.add('rec');
  document.getElementById('chDot').classList.add('rec');

  rafRec=requestAnimationFrame(recLoop);
  cToast('🔴 Запись идёт! Медленно поворачивайтесь вправо на 360°');
}

function stopRec(cancel){
  if(!recording)return;
  recording=false;
  cancelAnimationFrame(rafRec);

  document.getElementById('recBtn').classList.remove('recording');
  document.getElementById('recLabel').textContent='ЗАПИСЬ';
  document.getElementById('recLabel').classList.remove('recording');
  document.getElementById('topStatus').textContent=touchMode?'ТЯНИТЕ ЭКРАН ВЛЕВО':'НАЖМИТЕ ЗАПИСЬ';
  document.getElementById('topStatus').classList.remove('rec');
  document.getElementById('progBar').classList.remove('rec');
  document.getElementById('chDot').classList.remove('rec');

  if(cancel||!panoC)return;
  const deg=Math.abs(delta);
  if(deg<10){
    gToast('⚠️ Слишком мало движения','err');
    document.getElementById('liveStrip').classList.remove('visible');
    return;
  }
  buildPano();
}

/* ─── RECORDING LOOP ─── */
function recLoop(){
  if(!recording)return;
  const sinceLast=Math.abs(delta)-(lastDrawn<0?0:Math.abs(lastDrawn));
  if(sinceLast>=0.25)drawSlice();
  rafRec=requestAnimationFrame(recLoop);
}

function drawSlice(){
  const v=document.getElementById('vid');
  if(!v.videoWidth||!panoCtx)return;
  const normAngle=Math.abs(delta)%360;
  const x=(normAngle/360)*PANO_W;
  const prevNorm=lastDrawn<0?0:Math.abs(lastDrawn)%360;
  let sw2=Math.abs(normAngle-prevNorm)/360*PANO_W;
  sw2=Math.max(2,Math.ceil(sw2)+1);
  const srcX=Math.floor(v.videoWidth*0.4);
  const srcW=Math.max(2,Math.floor(v.videoWidth*0.2));
  panoCtx.drawImage(v,srcX,0,srcW,v.videoHeight,x-sw2/2,0,sw2,PANO_H);
  if(x+sw2>PANO_W)panoCtx.drawImage(v,srcX,0,srcW,v.videoHeight,x-sw2/2-PANO_W,0,sw2,PANO_H);
  if(x-sw2/2<0)panoCtx.drawImage(v,srcX,0,srcW,v.videoHeight,x-sw2/2+PANO_W,0,sw2,PANO_H);
  lastDrawn=delta;
  // update strip preview
  const sc=document.getElementById('stripCanvas');
  if(sc&&panoC){
    const ctx=sc.getContext('2d');
    ctx.drawImage(panoC,0,0,PANO_W,PANO_H,0,0,sc.width,44);
  }
  setAngleUI(normAngle);
}

/* ─── BUILD FINAL ─── */
async function buildPano(){
  showLoad('Сборка панорамы');
  await new Promise(r=>setTimeout(r,60));
  const covered=Math.min(Math.abs(delta),360);
  const cropW=Math.round(covered/360*PANO_W);
  const fc=document.createElement('canvas');
  fc.width=Math.max(cropW,100);fc.height=PANO_H;
  const fctx=fc.getContext('2d');
  fctx.drawImage(panoC,0,0,cropW,PANO_H,0,0,cropW,PANO_H);
  // vignette
  const vg=fctx.createLinearGradient(0,0,0,PANO_H);
  vg.addColorStop(0,'rgba(0,0,0,.3)');vg.addColorStop(.15,'rgba(0,0,0,0)');
  vg.addColorStop(.85,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.3)');
  fctx.fillStyle=vg;fctx.fillRect(0,0,cropW,PANO_H);
  if(covered<355){
    const lr=fctx.createLinearGradient(0,0,cropW,0);
    lr.addColorStop(0,'rgba(0,0,0,.4)');lr.addColorStop(.04,'rgba(0,0,0,0)');
    lr.addColorStop(.96,'rgba(0,0,0,0)');lr.addColorStop(1,'rgba(0,0,0,.4)');
    fctx.fillStyle=lr;fctx.fillRect(0,0,cropW,PANO_H);
  }
  const url=fc.toDataURL('image/jpeg',.92);
  const pano={
    url,
    date:new Date().toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),
    angle:Math.round(covered),
    id:Date.now()
  };
  panos.unshift(pano);curIdx=0;
  document.getElementById('liveStrip').classList.remove('visible');
  setAngleUI(0);
  document.getElementById('topAngle').textContent='0°';
  // update gallery thumb btn
  const img=document.getElementById('galThumbImg');
  img.src=url;img.style.display='block';
  document.querySelector('#galBtn .side-icon').style.display='none';
  const badge=document.getElementById('cntBadge');
  badge.textContent=panos.length;badge.style.display='flex';
  hideLoad();
  openPreview(pano);
}

/* ─── PREVIEW ─── */
let vImg=null,vRaf=null,panX=0,velX=0,drag=false,lastDX=0,vW=0,vH=0;

function openPreview(pano){
  show('preview');
  document.getElementById('prevSub').textContent=pano.angle+'° · '+pano.date;
  const area=document.getElementById('viewerWrap');
  const canvas=document.getElementById('viewCanvas');
  vW=area.clientWidth;vH=area.clientHeight;
  canvas.width=vW;canvas.height=vH;
  canvas.style.width=vW+'px';canvas.style.height=vH+'px';
  panX=0;velX=0;drag=false;
  vImg=new Image();
  vImg.onload=()=>{renderView();startInertia();};
  vImg.src=pano.url;
  canvas.addEventListener('touchstart',e=>{drag=true;lastDX=e.touches[0].clientX;velX=0;},{passive:true});
  canvas.addEventListener('touchmove',e=>{
    e.preventDefault();
    const dx=e.touches[0].clientX-lastDX;
    panX-=dx*2.5;lastDX=e.touches[0].clientX;velX=-dx*2.5;
    renderView();
  },{passive:false});
  canvas.addEventListener('touchend',()=>{drag=false;});
  canvas.addEventListener('mousedown',e=>{drag=true;lastDX=e.clientX;velX=0;});
  window.addEventListener('mousemove',e=>{
    if(!drag||!document.getElementById('preview').classList.contains('active'))return;
    const dx=e.clientX-lastDX;panX-=dx*2.5;lastDX=e.clientX;velX=-dx*2.5;renderView();
  });
  window.addEventListener('mouseup',()=>{drag=false;});
}

function renderView(){
  if(!vImg||!vImg.complete)return;
  const canvas=document.getElementById('viewCanvas');
  const ctx=canvas.getContext('2d');
  const drawW=vH*(vImg.width/vImg.height);
  const off=((panX%drawW)+drawW)%drawW;
  ctx.clearRect(0,0,vW,vH);
  ctx.drawImage(vImg,drawW-off,0,drawW,vH);
  ctx.drawImage(vImg,-off,0,drawW,vH);
}

function startInertia(){
  cancelAnimationFrame(vRaf);
  function loop(){
    if(!drag){velX*=.93;panX+=velX;if(Math.abs(velX)>.4)renderView();}
    vRaf=requestAnimationFrame(loop);
  }loop();
}

function closePreview(){
  cancelAnimationFrame(vRaf);
  show(vs?'cam':'home');
}

function savePano(){
  const p=panos[curIdx];if(!p)return;
  const a=document.createElement('a');a.href=p.url;a.download='pano360_'+p.id+'.jpg';a.click();
  gToast('💾 Сохранено','ok');
}

async function sharePano(){
  const p=panos[curIdx];if(!p)return;
  try{
    const blob=await(await fetch(p.url)).blob();
    const f=new File([blob],'pano360.jpg',{type:'image/jpeg'});
    if(navigator.share&&navigator.canShare?.({files:[f]})){await navigator.share({title:'Панорама 360°',files:[f]});return;}
  }catch(e){}
  savePano();
}

/* ─── GALLERY ─── */
function goGallery(){show('gallery');renderGal();}
function closeGallery(){show(vs?'cam':'home');}

function renderGal(){
  const grid=document.getElementById('galGrid');
  const cnt=document.getElementById('galCnt');
  if(!panos.length){
    cnt.textContent='';
    grid.innerHTML='<div class="gal-empty"><div class="gal-empty-icon">🌐</div><div class="gal-empty-ttl">Нет панорам</div><div class="gal-empty-sub">Снимите первую 360°</div></div>';
    return;
  }
  cnt.textContent=panos.length+' шт';
  grid.innerHTML='';
  panos.forEach((p,i)=>{
    const el=document.createElement('div');
    el.className='gal-card';
    el.innerHTML=`<img src="${p.url}" alt=""><div class="gal-card-info">${p.date} · ${p.angle}°</div>`;
    el.onclick=()=>{curIdx=i;openPreview(p);};
    grid.appendChild(el);
  });
}

/* ─── TOUCH FAKE GYRO ─── */
const camEl=document.getElementById('cam');
camEl.addEventListener('touchstart',e=>{
  if(e.target.closest('#recBtn,.icon-btn,.side-btn'))return;
  touchX=e.touches[0].clientX;
},{passive:true});
camEl.addEventListener('touchmove',e=>{
  if(!touchMode||touchX===null)return;
  const dx=e.touches[0].clientX-touchX;
  contAngle+=(-dx*0.45);touchX=e.touches[0].clientX;
  updateLevel(0);tick();
  if(recording)drawSlice();
},{passive:true});
camEl.addEventListener('touchend',()=>{touchX=null;});

document.addEventListener('mousedown',e=>{
  if(!document.getElementById('cam').classList.contains('active'))return;
  if(e.target.closest('#recBtn,.icon-btn,.side-btn'))return;
  mX=e.clientX;
});
document.addEventListener('mousemove',e=>{
  if(!touchMode||mX===null)return;
  if(!document.getElementById('cam').classList.contains('active'))return;
  contAngle+=-(e.clientX-mX)*0.5;mX=e.clientX;
  tick();if(recording)drawSlice();
});
document.addEventListener('mouseup',()=>{mX=null;});
</script>
