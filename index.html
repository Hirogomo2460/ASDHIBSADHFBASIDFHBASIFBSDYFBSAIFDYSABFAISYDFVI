<script>
// ═══════════════════════════════════════════════════════
//  КАК РАБОТАЕТ АЛГОРИТМ:
//
//  Проблема чёрных полос была в том что:
//  1. Ждали определённый угол ДО захвата → между захватами = пробел
//  2. Ширина полосы зависела от скорости → при дёргании = разная ширина
//
//  РЕШЕНИЕ:
//  - RAF loop захватывает КАЖДЫЙ КАДР видео (30fps)
//  - Из каждого кадра берём узкую полосу шириной STRIP_PX пикселей
//    точно из центра видео (полная высота)
//  - Кладём её на позицию X = текущий_угол × PX_PER_DEG
//  - Полосы перекрываются (STRIP_PX > шаг между кадрами) → нет пробелов
//  - НЕТ тёмного blending → нет тёмных краёв
//  - Результат = непрерывная полоса без швов
// ═══════════════════════════════════════════════════════

// ── CONFIG ──────────────────────────────────────────────
// 15px на градус → при 360° = 5400px панорама
const PX_PER_DEG  = 15;
const PANO_H      = 1080;  // высота панорамы
const PANO_MAX_W  = 360 * PX_PER_DEG;  // 5400px

// Ширина полосы: берём с запасом (overlap) чтобы не было пробелов
// Чем больше STRIP_PX — тем больше overlap но меньше искажений по горизонту
const STRIP_PX    = 4;   // пикселей из центра видео на каждый кадр RAF

// ── STATE ────────────────────────────────────────────────
let vs=null, fac='environment';
let isRec=false, gyroOk=false, touchMode=false;
let prevA=null, smoothA=0, contA=0, startA=0, delta=0;
let panoC=null, panoCtx=null, rafR=null;
let panos=[], curI=-1;
let tX=null, mX=null;
// Track last written X to avoid gaps
let lastWrittenX = 0;

// ── SCREEN ───────────────────────────────────────────────
function go(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
}
function showL(t){document.getElementById('sl').textContent=(t||'').toUpperCase();document.getElementById('ld').classList.add('on')}
function hideL(){document.getElementById('ld').classList.remove('on')}
let gtT;
function gToast(m,tp=''){const e=document.getElementById('gts');e.textContent=m;e.className='gts on '+tp;clearTimeout(gtT);gtT=setTimeout(()=>e.classList.remove('on'),3000)}
let cTt;
function cToast(m){const e=document.getElementById('ctt');e.textContent=m;e.classList.remove('h');clearTimeout(cTt);cTt=setTimeout(()=>e.classList.add('h'),6000)}

// ── CAMERA ───────────────────────────────────────────────
async function startCam(){
  showL('Запуск камеры');
  try{
    vs=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:fac,width:{ideal:1920},height:{ideal:1080}},audio:false
    });
    const v=document.getElementById('vid');
    v.srcObject=vs; await v.play();
    hideL(); go('cam'); initGyro(); updUI(0);
    cToast('📱 Нажмите ● для записи, затем медленно поворачивайтесь вправо');
  }catch(e){hideL();gToast('❌ Нет доступа к камере. Разрешите в настройках.','er')}
}
function exitCam(){
  stopRec(true);
  if(vs){vs.getTracks().forEach(t=>t.stop());vs=null}
  window.removeEventListener('deviceorientation',onGyro,true);
  go('home');
}
async function flipCam(){
  fac=fac==='environment'?'user':'environment';
  if(vs){vs.getTracks().forEach(t=>t.stop());
    try{vs=await navigator.mediaDevices.getUserMedia({video:{facingMode:fac},audio:false});document.getElementById('vid').srcObject=vs}
    catch(e){fac=fac==='environment'?'user':'environment'}}
}

// ── GYRO ─────────────────────────────────────────────────
function initGyro(){
  prevA=null; contA=0; smoothA=0; gyroOk=false; touchMode=false;
  if(typeof DeviceOrientationEvent!=='undefined'&&typeof DeviceOrientationEvent.requestPermission==='function'){
    DeviceOrientationEvent.requestPermission()
      .then(s=>s==='granted'?window.addEventListener('deviceorientation',onGyro,true):enTouch())
      .catch(enTouch);
  }else{
    window.addEventListener('deviceorientation',onGyro,true);
    setTimeout(()=>{if(!gyroOk)enTouch()},1800);
  }
}

function onGyro(e){
  if(e.alpha==null){if(!gyroOk)enTouch();return}
  gyroOk=true;
  if(prevA===null){prevA=e.alpha;return}

  let d=e.alpha-prevA;
  if(d>180)d-=360; if(d<-180)d+=360;

  // Smoothing: low-pass filter to remove gyro jitter
  // alpha=0.7 means 70% new value, 30% old → smooth but responsive
  smoothA = smoothA*0.3 + d*0.7;
  contA += smoothA;
  prevA=e.alpha;

  updLevel(e.gamma);
  tickAngle();
}

function enTouch(){
  touchMode=true;
  document.getElementById('tst').textContent='ТЯНИТЕ ЭКРАН ВЛЕВО';
  cToast('👆 Гироскоп недоступен — тяните экран влево для поворота');
}

// ── ANGLE ────────────────────────────────────────────────
function tickAngle(){
  delta = contA - startA;
  const disp = Math.min(Math.abs(delta), 360);
  document.getElementById('deg').textContent = Math.round(Math.abs(delta))+'°';
  updUI(disp);
  document.getElementById('aR').style.display = delta>=0?'block':'none';
  document.getElementById('aL').style.display = delta<0?'block':'none';
  if(isRec && Math.abs(delta)>=360) stopRec(false);
}

function updUI(deg){
  const p=Math.min(deg/360,1), C=534;
  document.getElementById('ap').setAttribute('stroke-dasharray',(p*C).toFixed(1)+' '+C);
  const a=(p*360-90)*Math.PI/180;
  document.getElementById('ad').setAttribute('cx',(93+85*Math.cos(a)).toFixed(1));
  document.getElementById('ad').setAttribute('cy',(93+85*Math.sin(a)).toFixed(1));
  document.getElementById('pb').style.width=(p*100).toFixed(1)+'%';
  document.getElementById('scur').style.left=(p*100).toFixed(1)+'%';
  document.getElementById('spct').textContent=Math.round(p*100)+'% покрыто';
}

function updLevel(g){
  if(g==null)return;
  const t=Math.max(-45,Math.min(45,g)),b=document.getElementById('lb');
  b.style.left=(50+(t/45)*40)+'%';
  const a=Math.abs(t);b.className='lb2'+(a>25?' x':a>12?' w':'');
}

// ── RECORD ───────────────────────────────────────────────
function toggleRec(){isRec?stopRec(false):startRec()}

function startRec(){
  isRec=true; startA=contA; delta=0; lastWrittenX=0;

  panoC=document.createElement('canvas');
  panoC.width=PANO_MAX_W; panoC.height=PANO_H;
  panoCtx=panoC.getContext('2d');
  // Fill with near-black (not pure black, helps distinguish "not shot" areas)
  panoCtx.fillStyle='#0a0a0e';
  panoCtx.fillRect(0,0,PANO_MAX_W,PANO_H);

  const sw=document.getElementById('sw'); sw.classList.add('on');
  const sc=document.getElementById('sc');
  sc.width=sw.querySelector('.sb3').clientWidth||300; sc.height=54;

  document.getElementById('rb').classList.add('on');
  document.getElementById('rl').textContent='■ СТОП'; document.getElementById('rl').classList.add('on');
  document.getElementById('tst').textContent='● ЗАПИСЬ'; document.getElementById('tst').classList.add('r');
  document.getElementById('ap').style.stroke='#ff3b30';
  document.getElementById('ad').style.fill='#ff3b30';
  document.getElementById('xc').classList.add('r');
  document.getElementById('pb').classList.add('r');
  updUI(0);

  // Start continuous capture loop
  rafR = requestAnimationFrame(captureLoop);
  cToast('🔴 Запись! Медленно поворачивайтесь вправо на 360°');
}

function stopRec(cancel){
  if(!isRec)return; isRec=false; cancelAnimationFrame(rafR);
  document.getElementById('rb').classList.remove('on');
  document.getElementById('rl').textContent='ЗАПИСЬ'; document.getElementById('rl').classList.remove('on');
  document.getElementById('tst').textContent=touchMode?'ТЯНИТЕ ЭКРАН ВЛЕВО':'НАЖМИТЕ ЗАПИСЬ';
  document.getElementById('tst').classList.remove('r');
  document.getElementById('ap').style.stroke='#00e5ff';
  document.getElementById('ad').style.fill='#00e5ff';
  document.getElementById('xc').classList.remove('r');
  document.getElementById('pb').classList.remove('r');
  if(cancel||!panoC)return;
  if(Math.abs(delta)<5){gToast('⚠️ Слишком мало движения','er');document.getElementById('sw').classList.remove('on');return}
  buildPano();
}

// ── CAPTURE LOOP (runs every RAF frame ~16ms = 60fps) ────
// This is the KEY fix: we write continuously, not on gyro events
// So there are NEVER gaps between strips
function captureLoop(){
  if(!isRec)return;

  const v=document.getElementById('vid');
  if(v.videoWidth && panoCtx){

    // Current X position based on angle
    const absDelta = Math.abs(delta);
    if(absDelta <= 360){
      const targetX = Math.round(absDelta * PX_PER_DEG);

      // Fill from lastWrittenX to targetX to guarantee no gaps
      const fillFrom = Math.max(0, lastWrittenX - 2); // -2px overlap
      const fillTo   = Math.min(targetX, PANO_MAX_W);

      if(fillTo >= fillFrom){
        const fillW = Math.max(fillTo - fillFrom, 1);
        const vW=v.videoWidth, vH=v.videoHeight;

        // Source: fixed narrow strip from CENTER of video
        // Using exactly STRIP_PX wide from exact center
        const srcX = Math.round((vW - STRIP_PX) / 2);

        // Draw this strip stretched to fill the gap
        panoCtx.drawImage(
          v,
          srcX, 0, STRIP_PX, vH,  // source: center strip, full height
          fillFrom, 0, fillW, PANO_H  // dest: fill the gap on panorama
        );

        lastWrittenX = fillTo + 1;
      }

      // Update live preview every ~10 frames for performance
      if(Math.round(absDelta * 10) % 5 === 0){
        const sc=document.getElementById('sc');
        if(sc){
          const ctx=sc.getContext('2d');
          ctx.drawImage(panoC, 0,0,PANO_MAX_W,PANO_H, 0,0,sc.width,54);
        }
        updUI(absDelta);
      }
    }
  }

  rafR = requestAnimationFrame(captureLoop);
}

// ── BUILD FINAL PANORAMA ─────────────────────────────────
async function buildPano(){
  showL('Сборка панорамы');
  await new Promise(r=>setTimeout(r,80));

  const covDeg = Math.min(Math.abs(delta), 360);
  const cropW  = Math.max(Math.round(covDeg * PX_PER_DEG), 200);

  const fc=document.createElement('canvas');
  fc.width=cropW; fc.height=PANO_H;
  const fx=fc.getContext('2d');
  fx.drawImage(panoC, 0,0,cropW,PANO_H, 0,0,cropW,PANO_H);

  // Light vignette only (no dark bands)
  const vg=fx.createLinearGradient(0,0,0,PANO_H);
  vg.addColorStop(0,'rgba(0,0,0,.15)');
  vg.addColorStop(.08,'rgba(0,0,0,0)');
  vg.addColorStop(.92,'rgba(0,0,0,0)');
  vg.addColorStop(1,'rgba(0,0,0,.15)');
  fx.fillStyle=vg; fx.fillRect(0,0,cropW,PANO_H);

  const url=fc.toDataURL('image/jpeg',.93);
  const pano={url,date:new Date().toLocaleString('ru-RU',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),angle:Math.round(covDeg),id:Date.now()};
  panos.unshift(pano); curI=0;

  document.getElementById('sw').classList.remove('on');
  updUI(0); document.getElementById('deg').textContent='0°';

  const img=document.getElementById('gth'); img.src=url; img.style.display='block';
  document.querySelector('#galb .sdi').style.display='none';
  const bd=document.getElementById('bdg'); bd.textContent=panos.length; bd.style.display='flex';

  hideL(); openPrev(pano);
}

// ── PREVIEW ──────────────────────────────────────────────
let vI=null,vRaf=null,pX=0,vXs=0,dr=false,ldx=0,vW2=0,vH2=0;

function openPrev(p){
  go('prev');
  document.getElementById('ps').textContent=p.angle+'° · '+p.date;
  const d=document.getElementById('vwr'), c=document.getElementById('vc');
  vW2=d.clientWidth; vH2=d.clientHeight;
  c.width=vW2; c.height=vH2; c.style.width=vW2+'px'; c.style.height=vH2+'px';
  pX=0; vXs=0; dr=false;
  vI=new Image(); vI.onload=()=>{rv();startIn()}; vI.src=p.url;
  const nc=c.cloneNode(false); nc.width=vW2; nc.height=vH2; nc.style.width=vW2+'px'; nc.style.height=vH2+'px';
  c.parentNode.replaceChild(nc,c);
  nc.addEventListener('touchstart',e=>{dr=true;ldx=e.touches[0].clientX;vXs=0},{passive:true});
  nc.addEventListener('touchmove',e=>{e.preventDefault();const dx=e.touches[0].clientX-ldx;pX-=dx*2.5;ldx=e.touches[0].clientX;vXs=-dx*2.5;rv()},{passive:false});
  nc.addEventListener('touchend',()=>{dr=false});
  nc.addEventListener('mousedown',e=>{dr=true;ldx=e.clientX;vXs=0});
  window.addEventListener('mousemove',e=>{if(!dr||!document.getElementById('prev').classList.contains('on'))return;const dx=e.clientX-ldx;pX-=dx*2.5;ldx=e.clientX;vXs=-dx*2.5;rv()});
  window.addEventListener('mouseup',()=>{dr=false});
}
function rv(){
  const c=document.getElementById('vc');
  if(!vI||!vI.complete||!c)return;
  const ctx=c.getContext('2d');
  const dw=vH2*(vI.width/vI.height);
  const off=((pX%dw)+dw)%dw;
  ctx.clearRect(0,0,vW2,vH2);
  ctx.drawImage(vI,dw-off,0,dw,vH2);
  ctx.drawImage(vI,-off,0,dw,vH2);
}
function startIn(){
  cancelAnimationFrame(vRaf);
  (function loop(){if(!dr){vXs*=.92;pX+=vXs;if(Math.abs(vXs)>.3)rv()}vRaf=requestAnimationFrame(loop)})();
}
function closePrev(){cancelAnimationFrame(vRaf);go(vs?'cam':'home')}
function savePano(){
  const p=panos[curI];if(!p)return;
  const a=document.createElement('a');a.href=p.url;a.download='pano360_'+p.id+'.jpg';a.click();gToast('💾 Сохранено','ok');
}
async function sharePano(){
  const p=panos[curI];if(!p)return;
  try{const b=await(await fetch(p.url)).blob();const f=new File([b],'pano360.jpg',{type:'image/jpeg'});if(navigator.share&&navigator.canShare?.({files:[f]})){await navigator.share({title:'Панорама 360°',files:[f]});return}}catch(e){}
  savePano();
}

// ── GALLERY ──────────────────────────────────────────────
function openGal(){go('gal');renderGal()}
function closeGal(){go(vs?'cam':'home')}
function renderGal(){
  const g=document.getElementById('gg'),c=document.getElementById('gcn');
  if(!panos.length){c.textContent='';g.innerHTML='<div class="ge"><div class="gei">🌐</div><div class="get">Нет панорам</div><div class="ges">Снимите первую 360°</div></div>';return}
  c.textContent=panos.length+' шт';g.innerHTML='';
  panos.forEach((p,i)=>{const el=document.createElement('div');el.className='gc';el.innerHTML=`<img src="${p.url}" alt=""><div class="gci">${p.date} · ${p.angle}°</div>`;el.onclick=()=>{curI=i;openPrev(p)};g.appendChild(el)});
}

// ── TOUCH FAKE GYRO ──────────────────────────────────────
const camEl=document.getElementById('cam');
camEl.addEventListener('touchstart',e=>{if(e.target.closest('#rb,.ib,.flp,.sdb'))return;tX=e.touches[0].clientX},{passive:true});
camEl.addEventListener('touchmove',e=>{
  if(!touchMode||tX===null)return;
  const dx=e.touches[0].clientX-tX;
  // Smooth touch too
  contA+=(-dx*.4); tX=e.touches[0].clientX;
  updLevel(0); tickAngle();
},{passive:true});
camEl.addEventListener('touchend',()=>{tX=null});
document.addEventListener('mousedown',e=>{if(!document.getElementById('cam').classList.contains('on'))return;if(e.target.closest('#rb,.ib,.flp,.sdb'))return;mX=e.clientX});
document.addEventListener('mousemove',e=>{if(!touchMode||mX===null||!document.getElementById('cam').classList.contains('on'))return;contA+=-(e.clientX-mX)*.5;mX=e.clientX;tickAngle()});
document.addEventListener('mouseup',()=>{mX=null});
</script>
